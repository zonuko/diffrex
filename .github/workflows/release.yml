name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: diffrex-windows-x86_64
            archive_ext: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: diffrex-linux-x86_64
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: diffrex-macos-aarch64
            archive_ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: diffrex-macos-x86_64
            archive_ext: tar.gz

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build UI bundle
        run: deno task build:ui

      - name: Setup Tree-sitter WASMs
        run: deno task setup:wasms

      - name: Compile application
        run: deno task compile

      - name: Create release archive and checksum
        run: |
          mv dist/diffrex "dist/${{ matrix.artifact_name }}"
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            tar.exe -a -c -f "${{ matrix.artifact_name }}.zip" -C dist "${{ matrix.artifact_name }}"
          else
            tar -czvf "${{ matrix.artifact_name }}.tar.gz" -C dist "${{ matrix.artifact_name }}"
          fi
          deno eval "const file = Deno.args[0]; const buf = await Deno.readFile(file); const hashBuf = await crypto.subtle.digest('SHA-256', buf); const hash = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join(''); await Deno.writeTextFile(file + '.sha256', hash + '  ' + file + '\n');" "${{ matrix.artifact_name }}.${{ matrix.archive_ext }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
            ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate consolidated SHA256SUMS.txt
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          echo "=== Generated SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
