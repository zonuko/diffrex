name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify UI bundle is up-to-date
        run: |
          deno task build:ui
          git diff --exit-code src/ui/bundle.js

      - name: Check code formatting
        run: deno fmt --check

      - name: Run linter
        run: deno lint

      - name: Type-check entry point
        run: deno check main.ts

      - name: Run test suite
        run: deno task test
