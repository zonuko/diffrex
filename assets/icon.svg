<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景グラデーション -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- 外枠グロー -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <!-- 左ペイン（Base）グラデーション -->
    <linearGradient id="leftPaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1" />
    </linearGradient>

    <!-- 右ペイン（Target/AI）グラデーション -->
    <linearGradient id="rightPaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1" />
    </linearGradient>

    <!-- 差分シンボル（Left: Cyan / Right: Emerald） -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="accentSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- ドロップシャドウ -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景アプリアイコン（Squircle） -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" filter="url(#dropShadow)" />

  <!-- 内部パネル（スプリットウィンドウ構造） -->
  <!-- 左ペイン -->
  <path d="M 72 136 C 72 110, 88 96, 112 96 L 246 96 L 246 416 L 112 416 C 88 416, 72 402, 72 376 Z" fill="url(#leftPaneGrad)" stroke="#334155" stroke-width="3" />

  <!-- 右ペイン -->
  <path d="M 266 96 L 400 96 C 424 96, 440 110, 440 136 L 440 376 C 440 402, 424 416, 400 416 L 266 416 Z" fill="url(#rightPaneGrad)" stroke="#334155" stroke-width="3" />

  <!-- 中央分割線 & ガター -->
  <line x1="256" y1="80" x2="256" y2="432" stroke="#475569" stroke-width="4" stroke-dasharray="8 6" />

  <!-- 左ペインのコード行モック -->
  <rect x="100" y="136" width="90" height="12" rx="4" fill="#64748b" opacity="0.6" />
  <rect x="100" y="164" width="120" height="12" rx="4" fill="#64748b" opacity="0.4" />
  
  <!-- 左側のマイナス（削除 / Base差分）ブロック -->
  <rect x="92" y="200" width="138" height="56" rx="8" fill="rgba(248, 113, 113, 0.15)" stroke="#f87171" stroke-width="2" />
  <rect x="110" y="224" width="36" height="8" rx="4" fill="#f87171" filter="url(#neonGlow)" />
  <rect x="156" y="222" width="60" height="12" rx="4" fill="#fca5a5" opacity="0.8" />

  <rect x="100" y="280" width="110" height="12" rx="4" fill="#64748b" opacity="0.4" />
  <rect x="100" y="308" width="80" height="12" rx="4" fill="#64748b" opacity="0.6" />

  <!-- 右ペインのコード行モック -->
  <rect x="294" y="136" width="90" height="12" rx="4" fill="#64748b" opacity="0.6" />
  <rect x="294" y="164" width="120" height="12" rx="4" fill="#64748b" opacity="0.4" />

  <!-- 右側のプラス（追加 / Target差分）ブロック -->
  <rect x="282" y="200" width="138" height="88" rx="8" fill="rgba(74, 222, 128, 0.15)" stroke="#4ade80" stroke-width="2" />
  <!-- プラス記号 -->
  <g transform="translate(302, 226)">
    <rect x="10" y="0" width="8" height="28" rx="4" fill="#4ade80" filter="url(#neonGlow)" />
    <rect x="0" y="10" width="28" height="8" rx="4" fill="#4ade80" filter="url(#neonGlow)" />
  </g>
  <rect x="340" y="226" width="64" height="12" rx="4" fill="#86efac" opacity="0.9" />
  <rect x="340" y="250" width="50" height="12" rx="4" fill="#86efac" opacity="0.7" />

  <rect x="294" y="312" width="100" height="12" rx="4" fill="#64748b" opacity="0.4" />
  <rect x="294" y="340" width="70" height="12" rx="4" fill="#64748b" opacity="0.6" />

  <!-- AI スパークル（中央上部） -->
  <path d="M 256 48 L 262 66 L 280 72 L 262 78 L 256 96 L 250 78 L 232 72 L 250 66 Z" fill="url(#accentSpark)" filter="url(#neonGlow)" />
  <path d="M 218 84 L 222 94 L 232 98 L 222 102 L 218 112 L 214 102 L 204 98 L 214 94 Z" fill="url(#accentSpark)" opacity="0.8" />
  <path d="M 294 84 L 298 94 L 308 98 L 298 102 L 294 112 L 290 102 L 280 98 L 290 94 Z" fill="url(#accentSpark)" opacity="0.8" />

  <!-- 下部 Diffrex ロゴ文字バッジ -->
  <g transform="translate(196, 360)">
    <rect x="0" y="0" width="120" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="60" y="21" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5" text-anchor="middle">DIFFREX</text>
  </g>
</svg>
